[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "v7"] }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
sha3 = "0.10"
k256 = { version = "0.13", features = ["ecdsa", "arithmetic", "ecdh"] }
# Plonky3 系列统一 0.7.0-rc.1（cargo search 已确认），勿混其他版本
p3-koala-bear = "0.7.0-rc.1"
p3-field = "0.7.0-rc.1"
p3-poseidon2 = "0.7.0-rc.1"
p3-poseidon2-air = "0.7.0-rc.1"
p3-symmetric = "0.7.0-rc.1"
p3-air = "0.7.0-rc.1"
p3-uni-stark = "0.7.0-rc.1"
p3-challenger = "0.7.0-rc.1"
p3-commit = "0.7.0-rc.1"
p3-dft = "0.7.0-rc.1"
p3-fri = "0.7.0-rc.1"
p3-matrix = "0.7.0-rc.1"
p3-merkle-tree = "0.7.0-rc.1"
postcard = { version = "1", features = ["alloc"] }
sha2 = "0.10"
aes-gcm = "0.10"
hkdf = "0.12"
rand = "0.8"
tracing = "0.1"
# HTTP 层（vg-api）：tower 为 dev 测试 oneshot（ServiceExt）依赖
axum = "0.8"
dotenvy = "0.15"
tower = { version = "0.5", features = ["util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# sqlx：PG 访问层（运行时 tokio；ID 全 String 故不需要 uuid feature）
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-none",
    "postgres",
    "chrono",
    "macros",
    "migrate",
] }
