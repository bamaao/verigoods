[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "v7"] }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
sha3 = "0.10"
k256 = { version = "0.13", features = ["ecdsa", "arithmetic", "ecdh"] }
# Plonky3 系列统一 0.7.0-rc.1（cargo search 已确认），勿混其他版本
p3-koala-bear = "0.7.0-rc.1"
p3-field = "0.7.0-rc.1"
p3-poseidon2 = "0.7.0-rc.1"
p3-poseidon2-air = "0.7.0-rc.1"
p3-symmetric = "0.7.0-rc.1"
p3-air = "0.7.0-rc.1"
p3-uni-stark = "0.7.0-rc.1"
p3-challenger = "0.7.0-rc.1"
p3-commit = "0.7.0-rc.1"
p3-dft = "0.7.0-rc.1"
p3-fri = "0.7.0-rc.1"
p3-matrix = "0.7.0-rc.1"
p3-merkle-tree = "0.7.0-rc.1"
postcard = { version = "1", features = ["alloc"] }
sha2 = "0.10"
aes-gcm = "0.10"
hkdf = "0.12"
rand = "0.8"
tracing = "0.1"
# HTTP 层（vg-api）：tower 为 dev 测试 oneshot（ServiceExt）依赖
axum = "0.8"
# 监管解密端点的 ExtraData 密文 base64 编解码（Task 24 REST 层）
base64 = "0.22"
# MCP 官方 Rust SDK（Task 25：server + streamable-http 服务端 transport）
# ⚠ 鉴权桥（vg-api/src/mcp/mod.rs actor_from_context）依赖 rmcp streamable-http
#   将 http::request::Parts（含 AuthedDid extension）透传进 RequestContext.extensions
#   的行为——rmcp 升级（含 3.2.x 补丁版）须重测 mcp_scenario + unsigned_mcp_post_is_401
rmcp = { version = "3.2", features = ["server", "macros", "transport-streamable-http-server"] }
http = "1"
schemars = "1.0"
dotenvy = "0.15"
tower = { version = "0.5", features = ["util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# sqlx：PG 访问层（运行时 tokio；ID 全 String 故不需要 uuid feature）
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-none",
    "postgres",
    "chrono",
    "macros",
    "migrate",
] }
# alloy：Polygon CDK 链层适配器（Task 26，vg-infra-chain 的可选依赖，
# feature chain-alloy 门控——默认配置零 alloy 编译成本）。
# 2.4.1（cargo search 确认最新稳定）；features 最小化：
# essentials = contract + provider-http + rpc-types + signer-local
alloy = { version = "2.4.1", default-features = false, features = [
    "std",
    "essentials",
    "reqwest",
    "reqwest-rustls-tls",
] }
